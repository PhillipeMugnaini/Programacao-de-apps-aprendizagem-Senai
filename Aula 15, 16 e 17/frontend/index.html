<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Add</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="" id="form">
        <fieldset>
            <legend>Adiconar User</legend>
            <input type="text" placeholder="nome" id="nome">
            <br>
            <input type="email" placeholder="email" id="email">
            <br>
            <input type="password" placeholder="senha" id="senha">
            <br>
            <button type="submit">Registrar</button>
        </fieldset>
    </form>
    <br>
    <form action="" id="formUpdate">
        <fieldset>
            <legend>Atualizar User</legend>
            <input type="text" name="" id="idUpdate" disabled>
            <br>
            <input type="text" placeholder="nome" id="nomeUpdate">
            <br>
            <input type="email" placeholder="email" id="emailUpdate">
            <br>
            <input type="password" placeholder="senha" id="senhaUpdate">
            <br>
            <button type="submit">Atualizar</button>
        </fieldset>
    </form>
    <br>
    <br>
    <br>
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="listaUser">
            
        </tbody>
    </table>
    <script src="scripts.js"></script>
</body>
</html>
